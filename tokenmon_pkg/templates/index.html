<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokenmon - AI 编程工具 Token 用量分析</title>
<link rel="stylesheet" href="/static/app.css?v=19">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">TM</span>
    <div>
      <h1>tokenmon</h1>
      <p class="sub">AI 编程工具 Token 用量统计分析</p>
    </div>
  </div>
  <div class="actions">
    <button id="refresh" class="btn" type="button">刷新</button>
    <button id="collect" class="btn primary" type="button">重新采集</button>
    <a class="btn" id="export" href="/api/export.csv">导出 CSV</a>
  </div>
</header>

<section class="filters">
  <div class="group">
    <label>统计周期</label>
    <div class="segmented" id="period">
      <button type="button" data-value="day">日</button>
      <button type="button" data-value="week">周</button>
      <button type="button" data-value="month">月</button>
    </div>
  </div>
  <div class="group">
    <label>时间范围</label>
    <div class="nav">
      <button id="prevPeriod" class="btn icon" type="button" title="上一周期">&larr;</button>
      <span id="rangeLabel" class="range-label">-</span>
      <button id="nextPeriod" class="btn icon" type="button" title="下一周期">&rarr;</button>
    </div>
  </div>
  <div class="group">
    <label>回溯数量</label>
    <select id="span">
      <option value="1">1 个周期</option>
      <option value="7">7 个周期</option>
      <option value="14">14 个周期</option>
      <option value="30">30 个周期</option>
      <option value="90">90 个周期</option>
    </select>
  </div>
  <div class="group grow wide filter-pair">
    <div class="filter-pair-item filter-pair-tools">
      <label>工具筛选（单选）</label>
      <div class="chips" id="toolChips"></div>
    </div>
    <div class="filter-pair-item" id="modelRow" hidden>
      <label for="modelSelect">模型</label>
      <select id="modelSelect"><option value="">全部模型</option></select>
    </div>
  </div>

</section>

<p class="hint tool-notes" id="toolNotes"></p>

<section class="kpis" id="kpis"></section>

<section class="grid">
  <div class="card wide">
    <div class="card-head">
      <h2>Token 趋势</h2>
      <div class="chart-meta">
        <span class="hint" id="chartHint"></span>
        <div class="legend" id="seriesLegend"></div>
      </div>
    </div>
    <div class="chart" id="chart"></div>
  </div>
</section>

<section class="grid">
  <div class="card span6">
    <div class="card-head"><h2>账户余额与额度</h2>
      <a class="btn" href="/api/export-accounts.csv">导出 CSV</a></div>
    <table class="table" id="accountTable"><thead><tr>
      <th>工具</th><th>类型</th><th>账户</th><th class="num">余额 / 已用</th>
      <th class="num">剩余</th><th>重置时间</th>
    </tr></thead><tbody></tbody></table>
    <p class="hint" id="accountHint"></p>
  </div>
  <div class="card span6">
    <div class="card-head"><h2>已花费金额</h2></div>
    <table class="table" id="costTable"><thead><tr>
      <th>工具</th><th class="num">金额</th><th class="num">会话数</th>
      <th class="num">记录数</th>
    </tr></thead><tbody></tbody></table>
    <p class="hint" id="costHint"></p>
  </div>
</section>

<section class="grid">
  <div class="card span6">
    <div class="card-head"><h2>按工具</h2></div>
    <table class="table" id="toolTable"><thead><tr>
      <th>工具</th><th class="num">总 Token</th><th class="num">输入</th>
      <th class="num">输出</th><th class="num">推理</th>
      <th class="num">缓存命中</th><th class="num">缓存写入</th>
      <th class="num">交互次数</th><th class="num">命中率</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <div class="card span6">
    <div class="card-head"><h2>按模型</h2></div>
    <table class="table" id="modelTable"><thead><tr>
      <th>模型</th><th>工具</th><th class="num">输入</th>
      <th class="num">输出</th><th class="num">推理</th>
      <th class="num">缓存命中</th><th class="num">总 Token</th>
      <th class="num">调用次数</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <div class="card span6">
    <div class="card-head"><h2>按项目</h2></div>
    <table class="table" id="projectTable"><thead><tr>
      <th>项目</th><th class="num">输入</th><th class="num">输出</th>
      <th class="num">推理</th><th class="num">缓存命中</th>
      <th class="num">总 Token</th><th class="num">交互次数</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <div class="card span6">
    <div class="card-head"><h2>最近明细</h2><span class="hint" id="recordHint"></span></div>
    <table class="table" id="recordTable"><thead><tr>
      <th>时间</th><th>工具</th><th>模型</th>
      <th class="num">输入</th><th class="num">输出</th><th class="num">推理</th>
      <th class="num">缓存命中</th><th class="num">合计</th>
    </tr></thead><tbody></tbody></table>
  </div>
</section>

<footer class="footer">
  <span id="dbPath"></span>
  <span id="status"></span>
</footer>

<script src="/static/app.js?v=19"></script>
</body>
</html>
